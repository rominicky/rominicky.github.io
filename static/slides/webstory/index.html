<!doctype html>

    <!-- Reveal.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">

    <!-- Estilos  -->
    <link rel="stylesheet" href="/slides/webstory/styles.css">

    <!-- Lightbox -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>
  </head>

  <body>
    <div class="reveal">
      <div class="slides">

        <section
          data-markdown="/slides/webstory/slides.md"

        </section>

        <!-- <section>
          <h2>Mapa Interactivo – Leaflet</h2>
          <iframe
            src="/slides/webstory/mapa.html"
            width="100%" height="500"
            style="border:0; border-radius:12px; box-shadow:0 0 20px rgba(0,0,0,0.4);">
          </iframe>
        </section> -->

      </div>
    </div>

    <div id="floating-back"><a href="#/0">⟵ Inicio</a></div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>

    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: true,
        transition: 'fade',
        width: 1280,
        height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
      });
    </script>
